{% comment %} include expects `resources` array with items: {type: 'video'|'slides', url: '...'} {% endcomment %}
<span class="resources" style="margin-left: 0.5em;">
  {% for r in include.resources %}
    <span class="resource resource--{{ r.type }}" style="margin-right: 0.2em;">
      {% if r.type == 'video' %}
        <a href="{{ r.url }}" target="_blank" rel="noopener" title="Video"><i class="fas fa-video" aria-hidden="true"></i><span class="sr-only">video</span></a>
      {% elsif r.type == 'slides' %}
        <a href="{{ r.url }}" target="_blank" rel="noopener" title="Slides"><i class="fab fa-slideshare" aria-hidden="true"></i><span class="sr-only">slides</span></a>
      {% else %}
        <a href="{{ r.url }}" target="_blank" rel="noopener" title="{{ r.type }}">{{ r.type }}</a>
      {% endif %}
    </span>
  {% endfor %}
</span>
